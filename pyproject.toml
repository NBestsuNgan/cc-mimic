[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "myagent"
version = "0.1.2"
requires-python = ">=3.11"

[project.scripts]
myagent = "main:main"

[tool.setuptools]
py-modules = ["main"]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]