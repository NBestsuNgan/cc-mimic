name: Build and publish image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "deploy/README.md"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Covers workspace scoping, path traversal, and the shell-approval denylist.
      - run: python test_app.py

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN can push to ghcr; no PAT needed
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # ghcr rejects any uppercase in the path, and GitHub usernames keep their case.
      - id: img
        run: echo "repo=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr "A-Z" "a-z")/cc-mimic" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Must match the VM's CPU. GCP e2-micro is x86; switch to linux/arm64
          # for an Oracle Ampere box.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:latest
            ${{ steps.img.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: |
          echo "### Pushed \`${{ steps.img.outputs.repo }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "The \`deploy\` job ships it. If that job was skipped, the VM's \`cc-mimic-update.timer\` picks it up within a day, or run \`sudo /usr/local/bin/cc-mimic-update\` on the VM now." >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Skips cleanly until the GCP vars are set, so this file never breaks a push
    # on a fork or before Workload Identity Federation is wired up.
    if: ${{ vars.GCP_WIF_PROVIDER != '' }}
    permissions:
      contents: read
      id-token: write        # required to mint the OIDC token WIF verifies
    steps:
      # Keyless: GitHub mints an OIDC token, GCP swaps it for a 1-hour access
      # token. No service-account JSON exists, so there is nothing to leak or rotate.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # Through IAP, so port 22 stays closed to the internet and this keeps
      # working when the VM's ephemeral IP changes.
      #
      # This is deploy/update.sh inlined against absolute paths on purpose. The SSH
      # user here is the service account, whose home is /home/sa_<id> — so `~/deploy`
      # resolves to a directory that has never existed. /opt/cc-mimic and
      # /etc/cc-mimic are the same for every user.
      - name: Pull the new image on the VM
        run: |
          # Without pipefail the pipe to tee swallows gcloud's exit code and a
          # failed deploy reports green — the exact silence this job exists to end.
          set -o pipefail
          gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --project="${{ vars.GCP_PROJECT }}" \
            --zone="${{ vars.GCP_ZONE }}" \
            --tunnel-through-iap --quiet \
            --command='sudo bash -c "cd /opt/cc-mimic && set -a && . /etc/cc-mimic/deploy.env && set +a && docker compose pull && docker compose up -d && docker image prune -f"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
